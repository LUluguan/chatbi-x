[project]
name = "chatbi-x"
version = "0.1.0"
description = "评测驱动的 ChatBI / Text2SQL 数据问答 Agent（FastAPI + 自研工具循环 + 执行反馈自校正）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["pyarrow>=15"]
mcp = ["mcp>=1.2,<2"]  # 2.x 将 FastMCP 改名为 MCPServer，API 不兼容

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.providers", "app.eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
